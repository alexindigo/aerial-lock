name: QML Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the shared Arch lint image
        run: |
          # BuildKit runs inside a resource-limited Docker container.
          timeout 60s docker buildx create --name aerial-lint --driver docker-container \
            --driver-opt memory=4g,memory-swap=4g,cpu-period=100000,cpu-quota=200000
          timeout 120s docker buildx inspect --builder aerial-lint --bootstrap
          timeout 30s docker update --pids-limit=256 buildx_buildkit_aerial-lint0
          timeout 30s docker inspect buildx_buildkit_aerial-lint0 \
            --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.PidsLimit}} {{.HostConfig.CpuQuota}}/{{.HostConfig.CpuPeriod}}'
          timeout 20m docker buildx build --builder aerial-lint --pull --no-cache \
            --load -t aerial-lock-lint:ci .devcontainer

      - name: Run the shared checks offline
        run: |
          timeout 5m docker run --rm --pull=never --network=none \
            --memory=4g --memory-swap=4g --pids-limit=256 --cpus=2 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
            aerial-lock-lint:ci bash .devcontainer/check.sh
