# qmllint configuration for aerial-lock (Qt 6.11 category names).
# Quickshell modules (qs.*, Quickshell.*) can't be fully resolved —
# relax warnings that fire spuriously on these.

[General]
DisableDefaultLintAndFormatInfo=false

[Warnings]
# -- Relaxed --
# Unqualified property access (AUDIT H3: ~40 warnings). House style in
# Quickshell code, matches Atmosphera precedent; not worth the diff.
UnqualifiedAccess=disable

MissingProperty=error

# Import errors for custom modules that lack qmltypes.
ImportFailure=info
UnresolvedType=info
UncreatableType=info
IncompatibleType=info

# -- Kept strict (real bugs) --
MissingType=error
UnresolvedAlias=error
UnintentionalEmptyBlock=error
ReadOnlyProperty=error
ConfusingExpressionStatement=error
AliasCycle=error
DuplicatePropertyBinding=error
AssignmentInCondition=error
PropertyOverride=error
BadSignalHandlerParameters=info
Quick.LayoutsPositioning=warning
